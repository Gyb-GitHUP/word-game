<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="单词小闯关">
<meta name="theme-color" content="#3b6cf6">
<title>单词小闯关 · 小学英语读写记忆</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;
  --bg:#f4f6fb;--card:#fff;--ink:#16202c;--muted:#7c8798;--line:#e7ecf4;
  --brand:#3b6cf6;--brand2:#7a5cff;--ok:#12a150;--okbg:#e8f8ee;--bad:#e5484d;--badbg:#fdecec;
  --soft:#eef3ff;--warn:#f59e0b;
}
@media (prefers-color-scheme:dark){
  body{--bg:#0f141c;--card:#18202b;--ink:#e8eef7;--muted:#8e9aab;--line:#26303d;--soft:#1d2836;--okbg:#12301f;--badbg:#33191b}
}
body.dark{--bg:#0f141c;--card:#18202b;--ink:#e8eef7;--muted:#8e9aab;--line:#26303d;--soft:#1d2836;--okbg:#12301f;--badbg:#33191b}
.app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;background:var(--bg);position:relative}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(86px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}

/* 通用 */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(22,32,44,.06);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:600;
  background:var(--soft);color:var(--ink);cursor:pointer;min-height:50px;
  font-family:inherit;transition:transform .06s ease,opacity .15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 6px 16px rgba(59,108,246,.28)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600}
.page-title{font-size:22px;font-weight:800;letter-spacing:.3px;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.sec-title{font-size:14px;font-weight:700;color:var(--muted);margin:18px 4px 8px;letter-spacing:.5px}

/* 底部导航 */
nav{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;cursor:pointer}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--brand);background:var(--soft)}

/* 首页 */
.hero{background:linear-gradient(135deg,#3b6cf6,#7a5cff);border-radius:24px;padding:20px;color:#fff;
  box-shadow:0 10px 26px rgba(59,108,246,.3);margin-bottom:14px}
.hero h2{font-size:20px;font-weight:800;margin-bottom:6px}
.hero p{font-size:13px;opacity:.92;line-height:1.5}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px 12px;
  text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}
.quick button .ic{font-size:24px;display:block;margin-bottom:8px}
.quick button b{font-size:15px;display:block}
.quick button span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .4s}

/* 卡片 */
.progress-line{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.progress-line .bar{flex:1}
.flash{margin:12px 0 0;perspective:1000px;cursor:pointer;user-select:none}
.flash-inner{position:relative;width:100%;min-height:300px;transition:transform .45s cubic-bezier(.3,.8,.4,1);transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 6px 24px rgba(22,32,44,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.face.back{transform:rotateY(180deg)}
.word{font-size:42px;font-weight:800;letter-spacing:.5px;text-align:center;line-height:1.2;word-break:break-word}
.word.small{font-size:26px}
.cn{font-size:22px;font-weight:700;color:var(--brand)}
.hint{font-size:12px;color:var(--muted)}
.speaker{width:64px;height:64px;border-radius:50%;border:0;background:var(--soft);color:var(--brand);
  font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.speaker:active{transform:scale(.94)}
.rate-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.exbox{margin-top:2px;display:flex;flex-direction:column;align-items:center;gap:4px;max-width:100%}
.ex{font-size:16px;font-weight:700;color:var(--ink);text-align:center;line-height:1.35}
.excn{font-size:13px;color:var(--muted);text-align:center;line-height:1.3}
.ex-speaker{border:0;background:var(--soft);color:var(--brand);border-radius:999px;padding:5px 12px;
  font-size:12px;font-weight:700;cursor:pointer;margin-top:2px}
.ex-speaker:active{transform:scale(.95)}
.rate-row .btn{padding:14px 6px;font-size:15px}

/* 输入 */
.input-wrap{display:flex;gap:8px;margin-top:12px}
input[type=text]{flex:1;min-width:0;font-size:22px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;outline:none;letter-spacing:1px}
input[type=text]:focus{border-color:var(--brand)}
input.right{border-color:var(--ok);background:var(--okbg)}
input.wrong{border-color:var(--bad);background:var(--badbg)}
.feedback{margin-top:14px;border-radius:16px;padding:14px;font-size:15px;line-height:1.7;display:none}
.feedback.show{display:block}
.feedback.good{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
.feedback b{font-size:20px;letter-spacing:.5px}

/* 手写 */
.trace-box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px;margin-top:10px}
canvas{width:100%;height:210px;display:block;border-radius:14px;touch-action:none}

/* 选择器 */
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--brand);background:var(--soft);color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* 测验 */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);
  background:var(--card);font-size:17px;font-family:inherit;color:var(--ink);margin-bottom:10px;cursor:pointer;min-height:56px}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt:disabled{opacity:1}

/* 列表 */
.line-item{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--line);font-size:15px}
.line-item:last-child{border-bottom:0}
.line-item b{font-weight:700}
textarea{width:100%;min-height:110px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);
  color:var(--ink);font-family:inherit;font-size:14px;padding:12px;outline:none;resize:vertical;line-height:1.6}
select{font-family:inherit;font-size:15px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);max-width:100%}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(20,28,40,.92);color:#fff;
  padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px;line-height:1.8}
.big-emoji{font-size:48px;display:block;margin-bottom:10px}

.ol{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.ipa{font-size:15px;color:var(--muted);margin-top:6px;letter-spacing:.3px}
.ipa-inline{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}

/* 跟读 */
.mic{width:104px;height:104px;border-radius:52px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:40px;display:flex;align-items:center;justify-content:center;margin:16px auto 8px;box-shadow:0 8px 24px rgba(43,74,139,.28);cursor:pointer}
.mic.rec{background:#e5484d;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.45)}70%{box-shadow:0 0 0 18px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
.lvl-wrap{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.lvl-wrap i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc06a,#e5c33f,#e5484d);transition:width .08s linear}
.cmp{border-top:1px dashed var(--line);padding:10px 0 4px;margin-top:8px}
.cmp-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.cmp-row b{font-weight:700}
.stars{text-align:center;font-size:38px;letter-spacing:8px;line-height:1.15;user-select:none;margin:2px 0 6px}
.star{color:#dcdfe6}
.star.on{color:#f5b301;text-shadow:0 2px 8px rgba(245,179,1,.35)}
.stars.manual .star{cursor:pointer}
.verdict{border-radius:14px;padding:10px;text-align:center;font-weight:800;font-size:15px;margin-top:6px}
.verdict.good{background:var(--okbg);color:var(--ok)}
.verdict.near{background:#fff8e1;color:#9a6b00}
.verdict.bad{background:var(--badbg);color:var(--bad)}
.verdict.none{background:var(--soft);color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <main id="view"></main>
  <nav id="tabs">
    <button data-go="home"><span class="ic">🏠</span>今日</button>
    <button data-go="card"><span class="ic">🃏</span>卡片</button>
    <button data-go="dictation"><span class="ic">🎧</span>听写</button>
    <button data-go="trace"><span class="ic">✍️</span>手写</button>
    <button data-go="me"><span class="ic">⚙️</span>我的</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

    {id:'g4b-u4',title:'Unit 4 Going shopping',cn:'去购物',words:[
      ['jacket','夹克衫；短上衣','/ˈdʒækɪt/','This jacket is too small.','这件夹克太小了。'],['skirt','裙子','/skɜːt/','The skirt is pink.','这条裙子是粉色的。'],['dear','亲爱的','/dɪə(r)/','The bag is too dear.','这个包太贵了。'],['expensive','昂贵的','/ɪkˈspensɪv/','The watch is expensive.','这块手表很贵。'],

function load(){
  var s={};
  try{ s=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ s={}; }
  var out=JSON.parse(JSON.stringify(DEFAULT));
  for(var k in s){
    if(k==='settings'||k==='today'||k==='streak'){ for(var j in s[k]) out[k][j]=s[k][j]; }
    else out[k]=s[k];
  }
  return out;
}
var S=load();
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ /* 隐私模式下降级为内存存储 */ }
}
function ymd(d){ d=d||new Date(); var p=function(n){return String(n).padStart(2,'0')}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function tick(){
  var t=ymd();
  if(S.today.date!==t){ S.today={date:t,newCount:0,review:0,right:0,total:0}; }
  if(S.streak.date!==t && S.streak.date){
    var y=new Date(Date.now()-DAY); if(S.streak.date!==ymd(y)) S.streak.count=0;
  }
  save();
}

/* ---------- 词库访问 ---------- */
function lib(){
  if(S.custom) return S.custom;
  var id=S.settings.bank||'g5a';
  for(var i=0;i<BANKS.length;i++){ if(BANKS[i].id===id) return BANKS[i]; }
  return BANKS[0];
}
function switchBank(id){
  if(S.settings.bank===id) return;
  S.settings.bank=id; S.settings.units=null; save();
  sess=dict=quiz=traceS=null; toast('已切换到 '+lib().name); go('me');
}
function allWords(){
  var out=[];
  lib().units.forEach(function(u){
    u.words.forEach(function(w){ out.push({w:w[0],cn:w[1],ipa:w[2]||'',ex:w[3]||'',excn:w[4]||'',uid:u.id,unit:u.title,ucn:u.cn}); });
  });
  return out;
}
function activeWords(){
  var sel=S.settings.units; var ws=allWords();
  if(sel && sel.length) ws=ws.filter(function(x){ return sel.indexOf(x.uid)>=0; });
  return ws;
}
function kOf(w){
  /* 进度按“册次+单词”分开记：同一个词在不同年级册次里含义可能不同（如 free） */
  var b=S.custom?'custom':(S.settings.bank||'g5a');
  return b+'|'+String(w).toLowerCase();
}
function dueWords(){
  var now=Date.now(), ws=activeWords().filter(function(x){
    var p=S.prog[kOf(x.w)]; return p && p.due<=now;
  });
  ws.sort(function(a,b){ return S.prog[kOf(a.w)].due-S.prog[kOf(b.w)].due; });
  return ws;
}
function known(w){ return !!S.prog[kOf(w)]; }
function newLeft(){ return Math.max(0, (S.settings.dailyNew||10) - (S.today.newCount||0)); }
function newWords(n){
  var ws=activeWords().filter(function(x){ return !known(x.w); });
  return ws.slice(0,n);
}
function weakWords(n){
  var ws=activeWords().filter(function(x){ var p=S.prog[kOf(x.w)]; return p && p.b<=2; });
  ws.sort(function(a,b){ return (S.prog[kOf(a.w)].b||0)-(S.prog[kOf(b.w)].b||0); });
  return ws.slice(0,n);
}
function uniqWords(a){
  var seen={}, out=[];
  a.forEach(function(x){ var k=kOf(x.w); if(!seen[k]){ seen[k]=1; out.push(x); } });
  return out;
}
function wrongWords(){
  return activeWords().filter(function(x){ var p=S.prog[kOf(x.w)]; return p && p.b===0 && p.w>0; });
}
function buildQueue(n){
  n=n||10;
  var q=uniqWords(dueWords()).slice(0,n);
  if(q.length<n){ q=uniqWords(q.concat(newWords(n-q.length))); }
  if(q.length<n){ q=uniqWords(q.concat(weakWords(n-q.length))); }
  if(!q.length){ q=uniqWords(activeWords()).slice(0,n); }
  return q;
}
function startWrong(){
  var ws=wrongWords();
  if(!ws.length){ toast('错词本是空的，先练几组吧'); return; }
  sess={q:shuffle(ws).slice(0,20),i:0,right:0,wrong:0,flip:false,showCn:false};
  go('card');
}
function rateWord(word,q){
  var k=kOf(word); var wasKnown=!!S.prog[k]; var p=S.prog[k]||{b:0,r:0,w:0,seen:0};
  p.seen=(p.seen||0)+1; p.last=Date.now();
  if(q===0){ p.b=0; p.w=(p.w||0)+1; p.due=Date.now()+5*60000; }
  else if(q===1){ p.b=Math.max(1,p.b||0); p.r=(p.r||0)+1; p.due=Date.now()+DAY; }
  else { p.b=Math.min(IVL.length-1,(p.b||0)+1); p.r=(p.r||0)+1; p.due=Date.now()+IVL[p.b]*DAY; }
  S.prog[k]=p;
  if(!wasKnown) S.today.newCount=(S.today.newCount||0)+1;
  else S.today.review=(S.today.review||0)+1;
  save();
}
function markToday(ok){
  S.today.total=(S.today.total||0)+1; if(ok) S.today.right=(S.today.right||0)+1;
  var t=ymd();
  if(S.streak.date!==t){ S.streak.date=t; S.streak.count=(S.streak.count||0)+1; }
  save();
}

var VOICES=[], voiceReady=false, unlocked=false;
function loadVoices(){
  try{ VOICES=window.speechSynthesis.getVoices()||[]; if(VOICES.length) voiceReady=true; }catch(e){}
}
if('speechSynthesis' in window){
  loadVoices();
  window.speechSynthesis.onvoiceschanged=loadVoices;
}
function enVoices(){ return VOICES.filter(function(v){ return /^en/i.test(v.lang||''); }); }
function pickVoice(){
  var list=enVoices(); if(!list.length) return null;
  if(S.settings.voice){ for(var i=0;i<list.length;i++){ if(list[i].name===S.settings.voice) return list[i]; } }
  var pref=['Google US English','Samantha','Microsoft Aria','Microsoft Jenny','Microsoft Zira','Karen','Daniel','Google UK English Female'];
  for(var p=0;p<pref.length;p++){
    for(var j=0;j<list.length;j++){ if(list[j].name.indexOf(pref[p])>=0) return list[j]; }
  }
  return list[0];
}
function speak(text,slow){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读，建议用 Chrome / Safari'); return; }
  unlocked=true;
  try{ window.speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang='en-US';
  u.rate=(slow?0.55:(S.settings.rate||0.85));
  u.pitch=1;
  var v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  window.speechSynthesis.speak(u);
}
/* 提示音 */
var AC=null;
function beep(ok){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type='sine';
    if(ok){ o.frequency.setValueAtTime(880,t); o.frequency.setValueAtTime(1320,t+0.09); }
    else { o.frequency.setValueAtTime(300,t); o.frequency.setValueAtTime(200,t+0.12); }
    g.gain.setValueAtTime(0.08,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
    o.start(t); o.stop(t+0.24);
  }catch(e){}
}

/* =========================================================
   手写描红（四线三格）
   ========================================================= */
function startTrace(word){
  var ws=buildQueue(20);
  if(!ws.length){ go('me'); toast('请先选择至少一个单元'); return; }
  var idx=word?Math.max(0,ws.findIndex(function(x){return x.w===word;})) : 0;
  traceS={ws:ws,i:idx,strokes:[],drawing:false,showGuide:true};
  go('trace');
}
function vTrace(){
  if(!traceS){ traceS={ws:buildQueue(20),i:0,strokes:[],drawing:false,showGuide:true}; }
  if(!traceS.ws.length){ go('me'); return {html:'<div class="empty">请先在“我的”里选择单元</div>'}; }
  if(traceS.i>=traceS.ws.length) traceS.i=0;
  var it=traceS.ws[traceS.i];
  var html=
  '<div class="page-title">手写描红</div><div class="page-sub">先用手指跟着灰色字母写，再点“隐藏”自己写</div>'+
  '<div class="card" style="padding:14px">'+
    '<div class="between">'+
      '<div><div style="font-size:26px;font-weight:800">'+esc(it.w)+'</div>'+(it.ipa?'<div class="ipa">'+esc(it.ipa)+'</div>':'')+'<div class="small muted">'+esc(it.cn)+'</div></div>'+
      '<button class="speaker" id="spk" style="width:52px;height:52px;font-size:24px">🔊</button>'+
    '</div>'+
    '<div class="trace-box"><canvas id="cv"></canvas></div>'+
    '<div style="display:flex;gap:8px;margin-top:12px">'+
      '<button class="btn ghost" id="clear" style="flex:1">🧽 擦掉</button>'+
      '<button class="btn ghost" id="guide" style="flex:1">👁 隐藏描红</button>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:8px">'+
      '<button class="btn" id="prev" style="flex:1">← 上一个</button>'+
      '<button class="btn primary" id="next" style="flex:2">写好了，下一个 →</button>'+
    '</div>'+
  '</div>'+
  '<div class="small muted center" style="margin-top:12px">第 '+(traceS.i+1)+' / '+traceS.ws.length+' 个</div>';
  return {html:html, mount:function(){
    var cv=$('#cv');
    var armed=false;
    cv.addEventListener('pointerdown',function(){ armed=true; });
    function size(){
      var r=cv.getBoundingClientRect();
      var dpr=Math.min(window.devicePixelRatio||1,3);
      cv.width=Math.max(1,Math.round(r.width*dpr));
      cv.height=Math.max(1,Math.round(r.height*dpr));
      cv._w=r.width; cv._h=r.height; cv._dpr=dpr;
    }
    function redraw(){
      var w=cv._w||300,h=cv._h||210,ctx=cv.getContext('2d');
      ctx.setTransform(cv._dpr,0,0,cv._dpr,0,0);
      ctx.clearRect(0,0,w,h);
      /* 四线三格 */
      var top=22, band=(h-44)/3, red='#d9534f';
      ctx.strokeStyle=red; ctx.lineWidth=1.6; ctx.globalAlpha=.75;
      for(var i=0;i<4;i++){
        var y=top+band*i;
        ctx.beginPath(); ctx.moveTo(10,y); ctx.lineTo(w-10,y); ctx.stroke();
      }
      ctx.globalAlpha=1;
      /* 描红字 */
      if(traceS.showGuide){
        var fs=band*1.55;
        ctx.font='700 '+fs+'px "Comic Sans MS","Segoe Print","PingFang SC",system-ui,sans-serif';
        ctx.textAlign='center'; ctx.textBaseline='alphabetic';
        ctx.fillStyle='rgba(120,140,170,.30)';
        ctx.fillText(it.w, w/2, top+band*2);
      }
      /* 笔画 */
      ctx.strokeStyle='#2b4a8b'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
      traceS.strokes.forEach(function(st){
        if(!st.length) return;
        ctx.beginPath(); ctx.moveTo(st[0].x,st[0].y);
        for(var j=1;j<st.length;j++) ctx.lineTo(st[j].x,st[j].y);
        ctx.stroke();
      });
    }
    function pos(e){
      var r=cv.getBoundingClientRect();
      return {x:e.clientX-r.left,y:e.clientY-r.top};
    }
    function down(e){
      e.preventDefault(); armed=true;
      traceS.drawing=true; traceS.strokes.push([pos(e)]); redraw();
      if(cv.setPointerCapture) try{cv.setPointerCapture(e.pointerId);}catch(_){}
    }
    function move(e){
      if(!traceS.drawing) return; e.preventDefault();
      var p=pos(e), st=traceS.strokes[traceS.strokes.length-1];
      st.push(p);
      var ctx=cv.getContext('2d'); ctx.strokeStyle='#2b4a8b'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
      if(st.length>1){ ctx.beginPath(); ctx.moveTo(st[st.length-2].x,st[st.length-2].y); ctx.lineTo(p.x,p.y); ctx.stroke(); }
    }
    function up(e){ traceS.drawing=false; }
    cv.addEventListener('pointerdown',down);
    cv.addEventListener('pointermove',move);
    cv.addEventListener('pointerup',up);
    cv.addEventListener('pointercancel',up);
    size(); redraw();
    window.addEventListener('resize',function(){ size(); redraw(); });
    $('#spk').onclick=function(){ speak(it.w); };
    $('#clear').onclick=function(){ traceS.strokes=[]; redraw(); };
    $('#guide').onclick=function(){
      traceS.showGuide=!traceS.showGuide;
      $('#guide').textContent=traceS.showGuide?'👁 隐藏描红':'👁 显示描红';
      redraw();
    };
    $('#prev').onclick=function(){ traceS.i=(traceS.i-1+traceS.ws.length)%traceS.ws.length; traceS.strokes=[]; go('trace'); };
    $('#next').onclick=function(){
      rateWord(it.w,2); markToday(true);
      traceS.i++; traceS.strokes=[];
      if(traceS.i>=traceS.ws.length){ toast('这一组写完了，继续下一组'); startTrace(); return; }
      go('trace');
    };
  }};
}

function startQuiz(){
  var pool=activeWords(); if(!pool.length){ go('me'); return; }
  var qs=shuffle(pool).slice(0,10).map(function(it){
    var others=shuffle(pool.filter(function(x){ return x.w!==it.w && x.cn!==it.cn; })).slice(0,3);
    var opts=shuffle([it].concat(others));
    return {it:it,opts:opts};
  });
  quiz={qs:qs,i:0,right:0,locked:false};
  go('quiz');
}
function vQuiz(){
  if(!quiz){ startQuiz(); return {html:'<div class="empty">准备中…</div>'}; }
  if(quiz.i>=quiz.qs.length) return finishQuiz();
  var q=quiz.qs[quiz.i], n=quiz.qs.length;
  var html=
  '<div class="page-title">小测验</div><div class="page-sub">看中文，选出正确的英文单词</div>'+
  '<div class="progress-line"><span class="small muted">'+(quiz.i+1)+' / '+n+'</span><div class="bar"><i style="width:'+Math.round(quiz.i/n*100)+'%"></i></div></div>'+
  '<div class="card" style="margin-bottom:14px"><div class="center" style="font-size:24px;font-weight:800;padding:8px 0">'+esc(q.it.cn)+'</div></div>'+

/* =========================================================
   讯飞语音评测（可选：配置后替代浏览器识别打分）
   ========================================================= */
function xfCfg(){
  var x=S.xf||{};
  return (x.appid&&x.key&&x.secret)?x:null;
}
function xfB64(bytes){
  var s='', CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH){ s+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH)); }
  return btoa(s);
}
function xfUtf8(b64){
  var bin=atob(b64), a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(a);
}
function xfUrl(cfg){
  var host='ise-api.xfyun.cn', path='/v2/open-ise';
  var date=new Date().toUTCString();
  var origin='host: '+host+'\ndate: '+date+'\nGET '+path+' HTTP/1.1';
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(cfg.secret),{name:'HMAC',hash:'SHA-256'},false,['sign']).then(function(k){
    return crypto.subtle.sign('HMAC',k,enc.encode(origin));
  }).then(function(buf){
    var sig=new Uint8Array(buf);
    var sigB64=btoa(String.fromCharCode.apply(null,sig));
    var authOrigin='api_key="'+cfg.key+'", algorithm="hmac-sha256", headers="host date request-line", signature="'+sigB64+'"';
    return 'wss://'+host+path+'?authorization='+encodeURIComponent(btoa(authOrigin))+'&date='+encodeURIComponent(date)+'&host='+host;
  });
}
function xfPcm(blob){
  return blob.arrayBuffer().then(function(ab){
    var AC=window.AudioContext||window.webkitAudioContext;
    var ac=new AC();
    return new Promise(function(res,rej){ ac.decodeAudioData(ab,res,rej); }).then(function(buf){
      var rate=16000, dur=buf.duration||(buf.length/buf.sampleRate);
      var off=new OfflineAudioContext(1, Math.max(1,Math.ceil(dur*rate)), rate);
      var s=off.createBufferSource(); s.buffer=buf; s.connect(off.destination); s.start(0);
      return off.startRendering();
    }).then(function(out){
      try{ ac.close(); }catch(e){}
      var ch=out.getChannelData(0), pcm=new Int16Array(ch.length);
      for(var i=0;i<ch.length;i++){ var v=ch[i]; v=v>1?1:v<-1?-1:v; pcm[i]=v<0?v*0x8000:v*0x7fff; }
      return new Uint8Array(pcm.buffer);
    });
  });
}
function xfParse(xml){
  var doc=new DOMParser().parseFromString(xml,'text/xml');
  var nodes=doc.getElementsByTagName('read_word');
  for(var i=0;i<nodes.length;i++){
    if(nodes[i].getAttribute('total_score')!==null){
      return {
        total: parseFloat(nodes[i].getAttribute('total_score'))||0,
        accuracy: parseFloat(nodes[i].getAttribute('accuracy_score'))||0,
        fluency: parseFloat(nodes[i].getAttribute('fluency_score'))||0,
        rejected: nodes[i].getAttribute('is_rejected')==='true'
      };
    }
  }
  return null;
}
function xfAssess(pcm, word, cfg){
  return new Promise(function(resolve,reject){
    xfUrl(cfg).then(function(url){
      var ws=new WebSocket(url), done=false;
      var to=setTimeout(function(){ if(!done){ done=true; try{ws.close();}catch(e){} reject(new Error('评测超时')); } }, 20000);
      function fin(err,val){ if(done) return; done=true; clearTimeout(to); try{ws.close();}catch(e){} err?reject(err):resolve(val); }
      ws.onopen=function(){
        ws.send(JSON.stringify({
          common:{app_id:cfg.appid},
          business:{sub:'ise',ent:'en_vip',category:'read_word',cmd:'ssb',
                    auf:'audio/L16;rate=16000',aue:'raw',text:'\ufeff[word]\n'+word,
                    tte:'utf-8',ttp_skip:true,rst:'entirety',ise_unite:'1',extra_ability:'multi_dimension'},
          data:{status:0,data:''}
        }));
        setTimeout(function(){
          var CH=1280, i=0, n=pcm.length;
          function next(){
            if(done || ws.readyState!==1 || i>=n) return;
            var chunk=pcm.subarray(i,i+CH), first=(i===0);
            i+=CH;
            var last=(i>=n);
            ws.send(JSON.stringify({
              business:{cmd:'auw',aus:last?4:(first?1:2)},
              data:{status:last?2:1,data:xfB64(chunk)}
            }));
            if(!last) setTimeout(next,40);
          }
          next();
        },350);
      };
      ws.onerror=function(){ fin(new Error('连接讯飞失败')); };
      ws.onclose=function(){ if(!done) fin(new Error('连接被关闭')); };
      ws.onmessage=function(ev){
        var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
        if(m.code!==0){ fin(new Error('讯飞返回 '+m.code+' '+(m.message||''))); return; }
        var d=m.data||{};
        if(d.status===2){
          var r=xfParse(xfUtf8(d.data||''));
          if(r) fin(null,r); else fin(new Error('结果解析失败'));
        }
      };
    }).catch(reject);
  });
}
function xfStars(s){ return s>=90?5 : s>=80?4 : s>=65?3 : s>=50?2 : 1; }

/* 录音结束后的统一收尾：有讯飞凭证走讯飞，否则回落到浏览器识别 */
function asrFallback(self){
  var spoken=(FOLLOW.alts&&FOLLOW.alts.length?FOLLOW.alts[0]:'')||FOLLOW.interim||'';
  self.heard=spoken;
  self.verdict=followCompare(spoken, self.it.w);
  if(!spoken && self.asrOK){
    self.asrNote = FOLLOW.asrErr ? ('自动识别没成功（'+FOLLOW.asrErr+'），可以自己听录音对比') : '没有识别到英文，可以自己听录音对比';
  }
}
function followFinish(blob, self){
  var cfg=xfCfg();
  function done(){
    followCleanupKeepAudio();
    self.phase='done';
    if(!self.stars) self.stars=followStars();
    followSave(self);
    if(cur.name==='follow') go('follow');
  }
  if(!cfg || !blob){
    setTimeout(function(){ asrFallback(self); done(); }, 700);
    return;
  }
  self.phase='scoring';
  if(cur.name==='follow') go('follow');
  xfPcm(blob).then(function(pcm){
    return xfAssess(pcm, self.it.w, cfg);
  }).then(function(r){
    self.xf=r;
    self.stars = r.rejected ? 1 : xfStars(r.total);
    self.verdict = {level: r.rejected?'bad':(r.total>=80?'good':r.total>=65?'near':'bad'), score:r.total, msg:''};
    done();
  }).catch(function(e){
    self.xfErr=(e&&e.message)?e.message:String(e);
    setTimeout(function(){ asrFallback(self); done(); }, 300);
  });
}

/* =========================================================
   跟读 + 打星（示范 → 录音 → 回放对比 → 识别比对 → 1-5 星）
   ========================================================= */
var followS=null;
var FOLLOW={stream:null,rec:null,chunks:[],url:'',timer:null,t0:0,ac:null,analyser:null,raf:0,peak:0,sr:null,alts:null,interim:'',asrErr:''};

function followCleanup(){
  try{ if(FOLLOW.rec && FOLLOW.rec.state==='recording') FOLLOW.rec.stop(); }catch(e){}
  FOLLOW.rec=null;
  if(FOLLOW.timer){ clearTimeout(FOLLOW.timer); FOLLOW.timer=null; }
  if(FOLLOW.sr){ try{ FOLLOW.sr.abort(); }catch(e){} FOLLOW.sr=null; }
  if(FOLLOW.stream){ try{ FOLLOW.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} FOLLOW.stream=null; }
  if(FOLLOW.ac){ try{ FOLLOW.ac.close(); }catch(e){} FOLLOW.ac=null; }
  FOLLOW.analyser=null;
  if(FOLLOW.raf){ cancelAnimationFrame(FOLLOW.raf); FOLLOW.raf=0; }
}

function startFollow(it, noPush){
  if(!it){ toast('先选一个单词'); return; }
  FOLLOW.stack=FOLLOW.stack||[];
  if(!noPush){ FOLLOW.stack.push(it); if(FOLLOW.stack.length>50) FOLLOW.stack=FOLLOW.stack.slice(-50); }
  followCleanup();
  var k=kOf(it.w), hist=(S.say||{})[k]||{};
  followS={it:it, phase:'ready', verdict:null, heard:'', url:'', recMs:0, refMs:0, peak:0, quiet:false,
           err:'', asrNote:'', selfStars:0, best:hist.best||0,
           asrOK:!!(window.SpeechRecognition||window.webkitSpeechRecognition)};
  go('follow');
}
function followPrev(){
  var st=FOLLOW.stack||[];
  if(st.length<2){ toast('已经是第一个词了'); return; }
  st.pop();
  startFollow(st[st.length-1], true);
}
function startFollowNext(){
  var q=buildQueue(20);
  if(!q.length){ toast('请先选择至少一个单元'); return; }
  FOLLOW.seen=FOLLOW.seen||[];
  if(followS && followS.it) FOLLOW.seen.push(followS.it.w);
  var pick=null;
  for(var i=0;i<q.length;i++){
    if(FOLLOW.seen.indexOf(q[i].w)<0){ pick=q[i]; break; }
  }
  if(!pick){ FOLLOW.seen=[]; pick=q[0]; }
  FOLLOW.seen.push(pick.w);
  if(FOLLOW.seen.length>40) FOLLOW.seen=FOLLOW.seen.slice(-20);
  startFollow(pick);
}

function speakTimed(text, cb){
  if(!('speechSynthesis' in window)){ toast('当前浏览器不支持朗读'); return; }
  try{ window.speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(String(text));
  u.lang='en-US'; u.rate=(S.settings.rate||0.85); u.pitch=1;
  var v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
  var t0=performance.now(), fired=false;
  u.onend=function(){ if(fired) return; fired=true; if(cb) cb(performance.now()-t0); };
  u.onerror=function(){ if(fired) return; fired=true; if(cb) cb(0); };
  window.speechSynthesis.speak(u);
}

function followASR(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  try{
    var r=new SR();
    r.lang='en-US'; r.continuous=false; r.interimResults=true; r.maxAlternatives=3;
    r.onresult=function(e){
      for(var i=e.results.length-1;i>=0;i--){
        var res=e.results[i];
        if(!res.isFinal){ if(res[0]) FOLLOW.interim=res[0].transcript; continue; }
        var arr=[]; for(var j=0;j<res.length;j++) arr.push(res[j].transcript);
        FOLLOW.alts=arr;
      }
    };
    r.onerror=function(e){ FOLLOW.asrErr=e.error||'error'; };
    r.start();
    FOLLOW.sr=r;
  }catch(e){ FOLLOW.asrErr='start-failed'; }
}

function followNorm(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim();
}
function followCompare(spoken, target){
  var a=followNorm(spoken), b=followNorm(target);
  if(!a) return {level:'none', score:0, msg:'没听清'};
  if(a===b) return {level:'good', score:100, msg:'读对了'};
  if(a.replace(/\s/g,'')===b.replace(/\s/g,'')) return {level:'good', score:95, msg:'读对了'};
  var sim=levRatio(a.replace(/\s/g,''), b.replace(/\s/g,''));
  if(sim>=0.75) return {level:'near', score:Math.round(sim*100), msg:'有点像'};
  return {level:'bad', score:Math.round(sim*100), msg:'不太像'};
}
function levRatio(a,b){
  var m=a.length,n=b.length;
  if(!m||!n) return 0;
  var d=[],i,j;
  for(i=0;i<=m;i++){ d[i]=[i]; }
  for(j=0;j<=n;j++){ d[0][j]=j; }
  for(i=1;i<=m;i++){
    for(j=1;j<=n;j++){
      d[i][j]=Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
  }
  return 1-d[m][n]/Math.max(m,n);
}

/* 分数 → 星 */
function starsFor(score){ return score>=95?5 : score>=85?4 : score>=70?3 : score>=50?2 : 1; }
function followStars(){
  var v=followS.verdict||{level:'none',score:0};
  if(v.level==='none') return 0;
  var s=v.score;
  if(followS.quiet) s=Math.min(s,70);                              /* 声音太小，最多 3 星 */
  if(followS.recMs && followS.recMs<400) s=Math.min(s,45);         /* 太短，多半没读完整 */
  if(followS.refMs && followS.recMs>followS.refMs*2.6) s=Math.min(s,80);
  return starsFor(s);
}

function followStartRec(){
  followS.err=''; followS.heard=''; followS.verdict=null; followS.selfStars=0;
  followS.quiet=false; followS.asrNote='';
  FOLLOW.alts=null; FOLLOW.interim=''; FOLLOW.asrErr=''; FOLLOW.peak=0;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    followS.err='这个浏览器不支持录音，建议用 Chrome / Edge 打开'; go('follow'); return;
  }
  followS.phase='asking'; go('follow');
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(function(stream){
    if(cur.name!=='follow'){ try{ stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} return; }
    FOLLOW.stream=stream;
    followS.phase='rec'; go('follow');
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext;
      FOLLOW.ac=new Ctx();
      var srcNode=FOLLOW.ac.createMediaStreamSource(stream);
      FOLLOW.analyser=FOLLOW.ac.createAnalyser(); FOLLOW.analyser.fftSize=1024;
      srcNode.connect(FOLLOW.analyser);
      followMeter();
    }catch(e){}
    var mime='';
    try{ if(window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime='audio/webm;codecs=opus'; }catch(e){}
    try{ FOLLOW.rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream); }
    catch(e){
      followS.err='录音初始化失败：'+(e && e.message ? e.message : e);
      followCleanup(); followS.phase='ready'; go('follow'); return;
    }
    FOLLOW.chunks=[];
    FOLLOW.rec.ondataavailable=function(e){ if(e.data && e.data.size) FOLLOW.chunks.push(e.data); };
    FOLLOW.rec.onstop=function(){
      var blob=null;
      try{
        blob=new Blob(FOLLOW.chunks,{type:(FOLLOW.rec&&FOLLOW.rec.mimeType)||'audio/webm'});
        if(followS.url) URL.revokeObjectURL(followS.url);
        followS.url=URL.createObjectURL(blob);
      }catch(e){}
      followS.peak=FOLLOW.peak;
      followS.quiet=(FOLLOW.peak<0.02);
      followFinish(blob, followS);
    };
    var t0=Date.now(); FOLLOW.t0=t0; followS.recMs=0;
    FOLLOW.rec.start();
    followASR();
    FOLLOW.timer=setTimeout(function(){
      if(FOLLOW.rec && FOLLOW.rec.state==='recording'){ followS.recMs=Date.now()-t0; FOLLOW.rec.stop(); }
    }, 4000);
  }).catch(function(e){
    if(cur.name!=='follow') return;
    var n=(e&&e.name)||'';
    followS.phase='ready';
    var isFile=(location.protocol==='file:');
    followS.err = (n==='NotAllowedError'||n==='SecurityError')
      ? (isFile
          ? '这个页面是本机文件（file://），手机浏览器一般不给它麦克风权限。用电脑打开可以正常授权；要在手机上用跟读，需要把文件放到 https 网页上。'
          : '麦克风被拒绝了。点地址栏左侧的图标（锁 / ⓘ / 调节）→ 权限 → 麦克风 → 允许，然后刷新页面。')
      : (n==='NotFoundError'
          ? '没有检测到麦克风，检查一下设备或系统权限。'
          : ('打不开麦克风：'+(n||e.message||e)));
    followCleanup(); go('follow');
  });
}
function followStopRec(){
  if(FOLLOW.rec && FOLLOW.rec.state==='recording'){
    followS.recMs=Date.now()-(FOLLOW.t0||Date.now());
    FOLLOW.rec.stop();
  }
}
function followCleanupKeepAudio(){
  if(FOLLOW.stream){ try{ FOLLOW.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){} FOLLOW.stream=null; }
  if(FOLLOW.ac){ try{ FOLLOW.ac.close(); }catch(e){} FOLLOW.ac=null; }
  FOLLOW.analyser=null;
  if(FOLLOW.raf){ cancelAnimationFrame(FOLLOW.raf); FOLLOW.raf=0; }
  FOLLOW.rec=null;
  if(FOLLOW.timer){ clearTimeout(FOLLOW.timer); FOLLOW.timer=null; }
  if(FOLLOW.sr){ try{ FOLLOW.sr.stop(); }catch(e){} FOLLOW.sr=null; }
}
function followMeter(){
  if(!FOLLOW.analyser) return;
  var buf=new Uint8Array(FOLLOW.analyser.fftSize);
  function tick(){
    if(!FOLLOW.analyser) return;
    FOLLOW.analyser.getByteTimeDomainData(buf);
    var sum=0,peak=0;
    for(var i=0;i<buf.length;i++){ var v=(buf[i]-128)/128; sum+=v*v; if(Math.abs(v)>peak) peak=Math.abs(v); }
    if(peak>FOLLOW.peak) FOLLOW.peak=peak;
    var el=document.getElementById('lvl');
    if(el) el.style.width=Math.min(100,Math.round(Math.sqrt(sum/buf.length)*420))+'%';
    FOLLOW.raf=requestAnimationFrame(tick);
  }
  tick();
}
function followSave(self){
  var k=kOf(self.it.w);
  S.say=S.say||{};
  var r=S.say[k]||{n:0,ok:0,best:0};
  var st=self.stars||0;
  r.n++;
  if(st>=4) r.ok++;
  if(st>(r.best||0)) r.best=st;
  self.best=r.best;
  S.say[k]=r;
  if(self.verdict && self.verdict.level!=='none') markToday(self.verdict.level==='good');
  save();
}
function followSelfStar(n){
  followS.selfStars=n;
  followS.stars=n;
  var k=kOf(followS.it.w);
  S.say=S.say||{};
  var r=S.say[k]||{n:0,ok:0,best:0};
  r.n++; if(n>=4) r.ok++; if(n>(r.best||0)) r.best=n;
  S.say[k]=r; save();
  go('follow');
}

function vFollow(){

      '<div class="small muted" style="margin-top:6px">'+(rec?'正在听… 读完点一下停止（4 秒自动停）':'准备中…')+'</div>'+
      (rec?'<div class="lvl-wrap"><i id="lvl"></i></div>':'')+
    '</div>';
  } else if(st==='done'){
    var v=followS.verdict||{level:'none',msg:'没听清',score:0};
    var auto=(v.level!=='none');
    var stars = followS.stars||0;
    var starHtml='';
    for(var i=1;i<=5;i++) starHtml+='<span class="star '+(i<=stars?'on':'')+'" data-s="'+i+'">★</span>';
    var tip = auto
      ? (v.level==='good'?'读对了':v.level==='near'?'有点像，再清楚一点':'再试一次')
      : (followS.selfStars?('已记为 '+followS.selfStars+'★'):'这台设备没法自动评分，自己听一遍给星星');
    html+=
    '<div class="card" style="text-align:center">'+
      '<div class="stars '+(auto?'':'manual')+'" id="stars">'+starHtml+'</div>'+
      (followS.xf?('<div class="small muted">讯飞评分 <b style="color:var(--ink)">'+followS.xf.total.toFixed(1)+'</b> 分 · 准确度 '+followS.xf.accuracy.toFixed(1)+(followS.xf.rejected?' · <b style="color:var(--bad)">没读成这个词</b>':'')+'</div>')
        :(followS.xfErr?('<div class="small muted">讯飞评测没成功（'+esc(followS.xfErr)+'），已用浏览器识别结果</div>'):''))+
      '<div class="small muted">'+(auto?('识别评分 '+Math.round(v.score)+' 分 · 历史最好 '+Math.max(followS.best||0,stars)+'★'):'点星星打分')+'</div>'+
      '<div class="verdict '+(auto?'':'none')+'">'+esc(tip)+'</div>'+
      (followS.heard?'<div class="small muted" style="margin-top:8px">识别为：<b>'+esc(followS.heard)+'</b></div>':'')+
      (followS.asrNote?'<div class="small muted" style="margin-top:6px">'+esc(followS.asrNote)+'</div>':'')+
      '<div class="cmp">'+
        '<div class="cmp-row"><span>示范</span><b>'+(followS.refMs?(followS.refMs/1000).toFixed(1)+' 秒':'—')+'</b></div>'+
        '<div class="cmp-row"><span>你读的</span><b>'+(followS.recMs?(followS.recMs/1000).toFixed(1)+' 秒':'—')+'</b></div>'+
        '<div class="cmp-row"><span>音量</span><b>'+(followS.quiet?'偏小，靠近一点':'正常')+'</b></div>'+
      '</div>'+
      '<div class="small muted" style="margin-top:6px;font-size:12px">星星按语音识别结果给，不是专业发音测评；重点听“我的”和“示范”的差别。</div>'+
      '<div class="small muted" style="margin-top:8px;line-height:1.6">'+
        (followS.refMs && followS.recMs ? (
          followS.recMs > followS.refMs*1.8 ? '语速比示范慢不少，可以跟着示范的节奏读。'
          : followS.recMs < followS.refMs*0.55 ? '比示范短很多，可能没读完整。'
          : '时长和示范接近。'
        ):'')+
      '</div>'+
    '</div>'+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn ghost" id="playMine" style="flex:1">▶ 听我的</button>'+
      '<button class="btn ghost" id="playRef2" style="flex:1">▶ 听示范</button>'+
    '</div>'+
    '<div class="row" style="margin-top:8px">'+
      '<button class="btn ghost" id="prevw" style="flex:0 0 96px">← 上一个</button>'+
      '<button class="btn" id="again" style="flex:1">🔁 再读一次</button>'+
      '<button class="btn primary" id="nextw" style="flex:1">下一个词 →</button>'+
    '</div>';
  } else {
    html+=
    '<div class="card" style="text-align:center;padding:14px">'+
      '<button class="mic" id="mic">🎤</button>'+
      '<div class="small muted" style="margin-top:6px">点一下，读这个词</div>'+
    '</div>'+
    '<div class="small muted center" style="margin-top:10px;line-height:1.7">'+
      (followS.asrOK?'读完自动识别并打星（1—5 星）。':'这个浏览器不支持自动识别，录音后自己打星。')+
      '<br>录音只在本机内存里，关掉页面就没了。'+
    '</div>'+
    '<div style="margin-top:10px"><button class="btn ghost block" id="prevw">← 上一个词</button></div>';
  }

  return {html:html, mount:function(){
    var ref=function(){
      speakTimed(it.w, function(ms){ if(ms>200){ followS.refMs=ms; var e=document.getElementById('refTime'); if(e) e.textContent='示范约 '+(ms/1000).toFixed(1)+' 秒'; } });
    };
    if($('#playRef')) $('#playRef').onclick=ref;
    if($('#playRef2')) $('#playRef2').onclick=ref;
    if($('#mic')) $('#mic').onclick=function(){ if(followS.phase==='rec') followStopRec(); else followStartRec(); };
    if($('#playMine')) $('#playMine').onclick=function(){ if(!followS.url){ toast('还没有录音'); return; } new Audio(followS.url).play(); };
    if($('#prevw')) $('#prevw').onclick=followPrev;
    if($('#again')) $('#again').onclick=followStartRec;
    if($('#nextw')) $('#nextw').onclick=startFollowNext;
    if($('#stars') && $('#stars').classList.contains('manual')){
      $('#stars').querySelectorAll('.star').forEach(function(s){
        s.onclick=function(){ followSelfStar(parseInt(s.getAttribute('data-s'),10)); };
      });
    }
    if(followS.phase==='ready' && S.settings.autoSpeak) setTimeout(ref, 260);
  }};
}

/* =========================================================
   我的 / 设置
   ========================================================= */
function vMe(){
  var all=activeWords().length, learned=activeWords().filter(function(x){return known(x.w);}).length;
  var wrong=activeWords().filter(function(x){ var p=S.prog[kOf(x.w)]; return p && p.b===0 && p.w>0; }).length;
  var vs=enVoices();
  var sel=S.settings.units;
  var unitHtml=lib().units.map(function(u){
    var on=!sel||!sel.length||sel.indexOf(u.id)>=0;
    var m=u.title.match(/^Unit\s*(\d+)\s*(.*)$/i);
    var label=m?('U'+m[1]+' '+m[2]):u.title;
    return '<button class="chip '+(on?'on':'')+'" data-u="'+u.id+'">'+esc(label)+' · '+u.words.length+'词</button>';
  }).join('');

  var html=
  '<div class="page-title">我的</div><div class="page-sub">词库、进度与设置</div>'+
  '<div class="sec-title">年级 / 册次</div>'+
  '<div id="banks">'+(function(){
      var grades=[]; BANKS.forEach(function(b){ if(grades.indexOf(b.grade)<0) grades.push(b.grade); });
      return grades.map(function(g){
        return '<div class="small muted" style="margin:6px 0 6px;font-weight:700">'+esc(g)+'</div>'+
          '<div class="chips" style="margin-bottom:8px">'+BANKS.filter(function(b){return b.grade===g;}).map(function(b){
            var on=(!S.custom)&&(S.settings.bank||'g5a')===b.id;
            var cnt=b.units.reduce(function(a,u){return a+u.words.length;},0);
            var short=b.name.replace('人教PEP 2024 · ','').replace('人教PEP · ','').replace(g,'');
            return '<button class="chip '+(on?'on':'')+'" data-b="'+b.id+'">'+esc(short)+' · '+cnt+'词</button>';
          }).join('')+'</div>';
      }).join('');
    })()+'</div>'+
  '<div class="small muted" style="margin:-2px 0 12px;line-height:1.6">单词按教材分册归类：一册一个词库，册内再按 Unit 分组。学习进度按册次分别记录，不互相顶替。</div>'+
  '<div class="card">'+
    '<div class="line-item"><span>当前词库</span><b>'+esc(lib().name)+'</b></div>'+
    '<div class="line-item"><span>在学单词</span><b>'+all+' 个</b></div>'+
    '<div class="line-item"><span>已学过 / 已掌握</span><b>'+learned+' / '+activeWords().filter(function(x){var p=S.prog[kOf(x.w)];return p&&p.b>=5;}).length+'</b></div>'+
    '<div class="line-item"><span>错词本</span><b style="color:var(--bad)">'+wrong+' 个</b></div>'+
  '</div>'+
  (wrong>0?'<button class="btn ghost block" id="meWrong" style="margin-top:-8px;margin-bottom:14px">🔁 重练这 '+wrong+' 个错词</button>':'')+

  '<div class="sec-title">每日新词</div>'+
  '<div class="chips" id="dn">'+[5,10,15,20].map(function(v){
      return '<button class="chip '+(S.settings.dailyNew===v?'on':'')+'" data-v="'+v+'">'+v+' 个</button>';
    }).join('')+'</div>'+

  '<div class="sec-title">朗读语速</div>'+
  '<div class="chips" id="rate">'+[['0.65','慢'],['0.85','正常'],['1','快']].map(function(v){
      return '<button class="chip '+(String(S.settings.rate)===v[0]?'on':'')+'" data-v="'+v[0]+'">'+v[1]+'</button>';
    }).join('')+'</div>'+

  '<div class="sec-title">发音设置</div>'+
  '<div class="card">'+
    '<div class="line-item" style="border:0;padding-bottom:8px"><span>英文语音</span>'+
      '<select id="voice" style="max-width:60%">'+(vs.length?vs.map(function(v){
        return '<option value="'+esc(v.name)+'" '+(S.settings.voice===v.name?'selected':'')+'>'+esc(v.name)+' ('+v.lang+')</option>';
      }).join(''):'<option>未检测到英文语音</option>')+'</select></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn ghost" id="testVoice" style="flex:1">🔊 试听</button>'+
      '<label class="chip '+(S.settings.autoSpeak?'on':'')+'" style="flex:1;justify-content:center"><input type="checkbox" id="auto" '+(S.settings.autoSpeak?'checked':'')+' style="margin-right:6px">自动读音</label></div>'+
    (vs.length?'':'<div class="small muted" style="margin-top:10px;line-height:1.7;color:#b45309">'+
      '本机没有读到英文语音包，示范音可能读不准。安卓可在「设置 → 系统 → 语言和输入法 → 文字转语音 → 安装语音数据」里装英语；'+
      '装完回到这里点「试听」。</div>')+
    '<div class="small muted" style="margin-top:10px;line-height:1.6">发音由手机自带语音合成完成，不需要联网。若声音不对，换一个语音或改用 Chrome / Safari 打开。</div>'+
  '</div>'+

  '<div class="sec-title">讯飞语音评测（可选）</div>'+
  '<div class="card">'+
    '<div class="small muted" style="line-height:1.7;margin-bottom:8px">填了这三项，跟读会用讯飞评测打分（准确度），比浏览器识别准；只存在这台设备的浏览器里。</div>'+
    '<div class="input-wrap" style="margin:6px 0"><input id="xfA" placeholder="AppID" autocomplete="off" value="'+esc((S.xf&&S.xf.appid)||'')+'"></div>'+
    '<div class="input-wrap" style="margin:6px 0"><input id="xfK" placeholder="APIKey" autocomplete="off" value="'+esc((S.xf&&S.xf.key)||'')+'"></div>'+
    '<div class="input-wrap" style="margin:6px 0"><input id="xfS" type="password" placeholder="APISecret" autocomplete="off" value="'+esc((S.xf&&S.xf.secret)||'')+'"></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn primary" id="xfSave" style="flex:1">保存</button>'+
      '<button class="btn ghost" id="xfClear" style="flex:0 0 auto">清除</button></div>'+
    '<div class="small muted" style="margin-top:8px;line-height:1.6" id="xfState">'+((S.xf&&S.xf.appid)?'已配置，跟读使用讯飞评测':'未配置，跟读使用浏览器识别')+'</div>'+
  '</div>'+
  '<div class="sec-title">单元范围（不选＝全部）</div>'+
  '<div class="chips" id="units">'+unitHtml+'</div>'+

  '<div class="sec-title">自定义词库</div>'+
  '<div class="card">'+
    '<div class="small muted" style="margin-bottom:8px;line-height:1.7">每行一个词：<b>单词,中文</b>（也支持空格、制表符分隔）。粘贴后点导入，会替换当前词库。</div>'+
    '<textarea id="importBox" placeholder="apple,苹果&#10;banana,香蕉&#10;go to school 上学"></textarea>'+
    '<div class="row" style="margin-top:8px">'+
      '<button class="btn primary" id="doImport" style="flex:1">导入</button>'+
      '<button class="btn ghost" id="doReset" style="flex:0 0 auto">恢复内置词库</button>'+
    '</div>'+
  '</div>'+

  '<div class="sec-title">数据</div>'+
  '<div class="card">'+
    '<div class="row"><button class="btn ghost" id="exportBtn" style="flex:1">导出进度</button>'+
      '<button class="btn ghost" id="clearBtn" style="flex:1;color:var(--bad)">清空学习记录</button></div>'+
    '<div class="small muted" style="margin-top:10px;line-height:1.6">学习记录保存在这台手机的浏览器里（localStorage）。换手机/清理浏览器数据会丢失，建议定期导出一份。</div>'+
  '</div>'+
  '<div class="small muted center" style="margin:18px 0 8px">单词小闯关 · 离线单文件版</div>';

    return {html:html, mount:function(){
    if($('#meWrong')) $('#meWrong').onclick=startWrong;
    if($('#xfSave')) $('#xfSave').onclick=function(){
      var a=($('#xfA').value||'').trim(), k=($('#xfK').value||'').trim(), s=($('#xfS').value||'').trim();
      if(!a||!k||!s){ toast('三项都要填'); return; }
      S.xf={appid:a,key:k,secret:s}; save(); toast('已保存'); go('me');
    };
    if($('#xfClear')) $('#xfClear').onclick=function(){ S.xf=null; save(); toast('已清除'); go('me'); };
    $('#banks').querySelectorAll('.chip').forEach(function(b){
      b.onclick=function(){ if(S.custom){ toast('请先恢复内置词库再切换'); return; } switchBank(b.getAttribute('data-b')); };
    });   $('#dn').querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ S.settings.dailyNew=parseInt(b.getAttribute('data-v'),10); save(); go('me'); }; });
    $('#rate').querySelectorAll('.chip').forEach(function(b){ b.onclick=function(){ S.settings.rate=parseFloat(b.getAttribute('data-v')); save(); go('me'); }; });
    $('#testVoice').onclick=function(){ speak('Hello! Let\'s learn English together.'); };
    if($('#voice')) $('#voice').onchange=function(){ S.settings.voice=this.value; save(); speak('Hello!'); };
    if($('#auto')) $('#auto').onchange=function(){ S.settings.autoSpeak=this.checked; save(); };
    $('#units').querySelectorAll('.chip').forEach(function(b){
      b.onclick=function(){
        var id=b.getAttribute('data-u');
        var all=lib().units.map(function(u){return u.id;});
        var sel=S.settings.units;
        if(!sel||!sel.length) sel=[id];            /* 未选＝全部：点一个就只学这一个 */
        else {
          var i=sel.indexOf(id);
          if(i>=0){ sel.splice(i,1); } else { sel.push(id); }
          if(!sel.length) sel=null;                /* 全取消＝恢复全部 */
          else if(sel.length===all.length) sel=null; /* 全选＝不选 */
        }
        if(sel && (sel.length===0 || sel.length===all.length)) sel=null;
        S.settings.units=sel; save(); go('me');
      };
    });
    $('#doImport').onclick=function(){
      var txt=$('#importBox').value||'';
      var lines=txt.split(/\r?\n/); var units=[{id:'custom-1',title:'我的词表',cn:'自定义',words:[]}];
      lines.forEach(function(L){
        L=L.trim(); if(!L) return;
        var m=L.match(/^unit\s*\d+/i);
        if(m){ units.push({id:'custom-'+(units.length+1),title:L,cn:L,words:[]}); return; }
        var parts=L.split(/[,，\t]+/);
        if(parts.length<2){ parts=L.split(/\s+/); if(parts.length<2) return; }
        var w=parts.shift().trim();
        if(parts.length>=4){ var cn=parts.shift().trim(), ipa=parts.shift().trim(), ex=parts.shift().trim(), exz=parts.join(' ').trim();
          units[units.length-1].words.push([w,cn,ipa,ex,exz]); }
        else { var cn2=parts.join(' ').trim(); if(w&&cn2) units[units.length-1].words.push([w,cn2]); }
      });
      units=units.filter(function(u){ return u.words.length; });
      var total=units.reduce(function(a,u){return a+u.words.length;},0);
      if(!total){ toast('没识别到单词，格式如：apple,苹果'); return; }
      S.custom={name:'自定义词库（'+total+'词）',units:units};
      S.settings.units=null; save(); toast('已导入 '+total+' 个单词'); go('me');
    };
    $('#doReset').onclick=function(){
      if(!S.custom){ toast('当前就是内置词库'); return; }
      S.custom=null; S.settings.units=null; save(); toast('已恢复内置词库'); go('me');
    };
    $('#exportBtn').onclick=function(){
      var blob=new Blob([JSON.stringify({exported:ymd(),prog:S.prog},null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='单词进度_'+ymd()+'.json'; a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
    };
    $('#clearBtn').onclick=function(){
      if(confirm('确定清空所有学习记录？（不可恢复）')){ S.prog={}; S.today={date:ymd(),newCount:0,review:0,right:0,total:0}; S.streak={date:'',count:0}; save(); toast('已清空'); go('me'); }
    };
  }};
}

/* ---------- 启动 ---------- */
tick();
go('home');
document.addEventListener('touchstart',function(){ unlocked=true; },{once:true});
document.addEventListener('click',function(){ unlocked=true; },{once:true});
</script>
